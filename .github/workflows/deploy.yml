name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: pptconverter-rg
  AZURE_CONTAINER_APP: pptconverter
  AZURE_CONTAINER_ENV: pptconverter-env
  AZURE_LOCATION: eastus

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and deploy to Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ env.AZURE_CONTAINER_APP }}
          containerAppEnvironment: ${{ env.AZURE_CONTAINER_ENV }}
          targetPort: 8000
          ingress: external
          imageToDeploy: ""
          dockerfilePath: Dockerfile
          environmentVariables: "API_KEY=secretref:api-key"
