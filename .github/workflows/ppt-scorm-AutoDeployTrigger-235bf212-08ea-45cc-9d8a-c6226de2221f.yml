name: Trigger auto deployment for ppt-scorm

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/ppt-scorm-AutoDeployTrigger-235bf212-08ea-45cc-9d8a-c6226de2221f.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.PPTSCORM_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.PPTSCORM_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.PPTSCORM_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: acrsslcheck.azurecr.io
          registryUsername: ${{ secrets.PPTSCORM_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.PPTSCORM_REGISTRY_PASSWORD }}
          containerAppName: ppt-scorm
          resourceGroup: rg-sslcheck
          imageToBuild: acrsslcheck.azurecr.io/ppt-scorm:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


